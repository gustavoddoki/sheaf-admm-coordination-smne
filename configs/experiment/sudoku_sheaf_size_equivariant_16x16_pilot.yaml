# @package _global_
# Feasibility smoke test only: 8 train / 2 validation / 2 test puzzles.
# The 16-symbol parameter tree also accepts 4x4 and 9x9 boards unchanged.
task: sudoku
model_type: sheaf

training:
  seed: 42
  lr: 1.7e-3
  weight_decay: 1.0e-7
  epochs: 1
  batch_size: 1
  warmup_steps: 1
  ema_decay: 0.99
  K_train: 1
  K_eval: 1
  loss_window: 1
  train_iters_dist: fixed
  val_interval: 1
  best_split: validation
  best_metric: completion

data:
  dir: datasets/sudoku_unique_16x16_pilot
  train_split: train
  val_splits: [validation]
  loader: puzzle

task_cfg:
  grid_size: 16
  num_classes: 17
  symbol_capacity: 16
  constraint_weight: 0.0

model:
  num_classes: 17
  sudoku_grid_size: 16
  sudoku_cell_dim: 24
  sudoku_symbol_capacity: 16
  d_v: 384
  d_e: 24
  encoder_arch: sudoku_equivariant
  enc_d_model: 16
  enc_num_blocks: 1
  objective_mode: non_negative
  x_solver: diagonal_prox
  z_solver: unrolled_cg
  z_mode: prox
  gamma: 2.0
  cg_iters: 1
  rm_sharing: sudoku_exact
  rm_mode: fixed
  rho_init: 0.25
  decoder_arch: sudoku
  sudoku_readout_mode: assignment
  sudoku_internal_projection_mode: sinkhorn
  sudoku_internal_sinkhorn_iters: 4
  sudoku_internal_sinkhorn_temperature: 1.0
