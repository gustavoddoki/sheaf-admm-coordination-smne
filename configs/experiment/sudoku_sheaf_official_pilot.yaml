# @package _global_
# CPU-feasible pilot on a deterministic subset of the official Sudoku dataset.
# This is deliberately smaller than the paper configuration and must not be
# reported as a full benchmark reproduction.
task: sudoku
model_type: sheaf

training:
  lr: 1.7e-3
  weight_decay: 1.0e-7
  epochs: 60
  batch_size: 32
  warmup_steps: 50
  ema_decay: 0.99
  K_train: 5
  K_eval: 20
  loss_window: 2
  train_iters_dist: fixed
  val_interval: 20

data:
  dir: datasets/sudoku_official_disjoint_pilot
  train_split: train
  val_splits: [test_hard]
  loader: puzzle

task_cfg: {}

model:
  num_classes: 10
  d_v: 144
  d_e: 16
  encoder_arch: sudoku
  enc_d_model: 64
  enc_num_blocks: 2
  comm_norm_type: layernorm
  objective_mode: non_negative
  x_solver: diagonal_prox
  z_solver: unrolled_cg
  z_mode: prox
  gamma: 2.0
  cg_iters: 3
  rm_sharing: sudoku
  rm_init: soft_slice
  rm_mode: fixed
  num_directions: 9
  rho_init: 0.25
  decoder_arch: sudoku
  dec_hidden_dims: [128]
